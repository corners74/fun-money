<!doctype html>
<html lang="en-NZ">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="One number: what you can spend freely this week.">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #fff7ec; --card: #ffffff; --ink: #2d2a32; --soft: #6f6874; --line: #f0e4d4;
    --bar: #f4eadc; --fun: #ff8a5b; --fun2: #ffb347; --teal: #2bb3a3; --gold: #f2b134;
    --violet: #8b7cf6; --shadow: 0 6px 24px rgba(120, 80, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1b24; --card: #2a2530; --ink: #f6efe6; --soft: #bbb1c0; --line: #3b3442; --bar: #3b3442; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 14px; }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; color: var(--soft); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  .icon-btn { background: var(--card); color: var(--ink); padding: 8px 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .card { background: var(--card); border-radius: 22px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .hero { text-align: center; padding: 26px 20px 22px; }
  .hero .label { font-size: 1rem; color: var(--soft); font-weight: 600; letter-spacing: .02em; }
  .hero .big { font-size: clamp(4rem, 18vw, 6.5rem); font-weight: 800; line-height: 1.05; margin: 6px 0 4px;
    background: linear-gradient(135deg, var(--fun), var(--fun2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .msg { font-size: 1.1rem; margin-top: 10px; }
  .bar { height: 14px; background: var(--bar); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--fun), var(--fun2)); transition: width .5s; }
  .bar.teal > span { background: linear-gradient(90deg, var(--teal), #6fd6c8); }
  .bar.gold > span { background: linear-gradient(90deg, var(--gold), #ffd36e); }
  .bar.violet > span { background: linear-gradient(90deg, var(--violet), #b6acff); }
  .hero .bar { height: 20px; margin: 14px auto 0; max-width: 420px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .pot { margin: 14px 0; }
  .pot-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .pot-name { font-weight: 600; }
  .pot-amt { font-weight: 700; white-space: nowrap; }
  .note { font-size: .88rem; color: var(--soft); margin-top: 4px; }
  .summary p { margin: 6px 0; font-size: 1.05rem; }
  .quick { display: grid; gap: 10px; }
  .quick-row { display: flex; gap: 8px; }
  input, select { font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: var(--fun); }
  .amount-in { font-size: 1.6rem; font-weight: 700; max-width: 170px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--bar); color: var(--ink); padding: 10px 14px; font-weight: 600; }
  .chip:hover { background: var(--fun); color: #fff; }
  .chip.small { font-size: .9rem; padding: 8px 12px; }
  .banner { border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; background: linear-gradient(135deg, #fff0d6, #ffe3d6); color: #3b2a20; }
  @media (prefers-color-scheme: dark) { .banner { background: linear-gradient(135deg, #4a3a2a, #4a2f2a); color: #fbeee0; } }
  .banner p { margin: 4px 0; }
  .banner .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { background: var(--fun); color: #fff; padding: 10px 16px; font-weight: 700; }
  .btn.ghost { background: transparent; color: inherit; border: 2px solid currentColor; opacity: .8; }
  .tx { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .tx:first-of-type { border-top: 0; }
  .tx button { background: none; color: var(--soft); padding: 4px 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 12px; }
  .stat .k { font-size: .85rem; color: var(--soft); }
  .stat .v { font-size: 1.3rem; font-weight: 700; }
  footer { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  footer button { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 10px 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--ink); color: var(--bg);
    padding: 14px 20px; border-radius: 16px; font-weight: 600; transition: transform .3s, opacity .3s; opacity: 0; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 40; animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: .2; } }
  /* settings */
  dialog { border: 0; border-radius: 22px; padding: 0; width: min(620px, calc(100% - 24px)); max-height: calc(100% - 24px);
    background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(30, 20, 30, .45); }
  .sheet { padding: 20px; }
  .sheet h2 { font-size: 1.3rem; }
  .sheet h3 { font-size: 1rem; margin: 22px 0 8px; color: var(--soft); text-transform: uppercase; letter-spacing: .05em; }
  .field { display: grid; grid-template-columns: 1fr 140px; gap: 10px; align-items: center; margin: 8px 0; }
  .field label { font-weight: 600; }
  .field small { display: block; font-weight: 400; color: var(--soft); }
  .potedit { background: var(--bg); border-radius: 14px; padding: 12px; margin: 10px 0; }
  .potedit .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .potedit .row label { font-size: .85rem; color: var(--soft); display: block; }
  .potedit input { background: var(--card); }
  .oneoff { display: grid; grid-template-columns: 52px 1fr 90px 34px; gap: 6px; margin: 10px 0; }
  .oneoff select { grid-column: 1 / -1; font-size: .9rem; }
  .oneoffs-mc { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
  .oneoffs-mc h3 { font-size: .95rem; margin: 10px 0 0; }
  .move-btn { margin-top: 8px; }
  .savings, .owed { margin-top: 16px; }
  .big-amt { font-size: 1.3rem; }
  .bar-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--soft); margin-top: 4px; }
  .runway { margin: 10px 0 2px; }
  .repay-btn { margin-top: 8px; color: var(--ink); }
  .sheet-actions { position: sticky; bottom: 0; background: var(--card); padding: 14px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }
  .linkish { background: none; color: var(--soft); text-decoration: underline; padding: 6px 0; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 600; margin: 8px 0; }
  .check input { width: 22px; height: 22px; }
  @media (max-width: 460px) { .field { grid-template-columns: 1fr 110px; } .grid2 { grid-template-columns: 1fr; } }
  .chip.on { background: var(--fun); color: #fff; }
  .datepick { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .datepick input { border: 0; background: transparent; padding: 0; width: auto; font-size: .9rem; color: inherit; }
  .month-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .month-head h2 { margin: 0; }
  .navbtn { background: var(--bar); color: var(--ink); width: 38px; height: 38px; font-size: 1.3rem; font-weight: 700; }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .month-line { margin: 8px 0; }
  .tag { font-size: .75rem; font-weight: 600; color: var(--soft); background: var(--bar); border-radius: 99px; padding: 2px 8px; margin-left: 4px; white-space: nowrap; }
  .small-link { font-size: .85rem; margin-top: 2px; }
  .inbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .inbox input, .inbox select { max-width: 170px; font-weight: 700; }
  .gl-open { margin-top: 8px; width: 100%; color: var(--ink); }
  .gl { background: var(--bg); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .gl h3 { margin: 0 0 4px; font-size: 1rem; }
  .gl .actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .gl-result { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .gl-result p { margin: 6px 0; }
  .catchup { display: grid; gap: 8px; margin-top: 10px; }
  .catchup label { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; font-weight: 600; }
  .catchup small { font-weight: 400; opacity: .8; }
  .catchup input, .banner .inbox input { background: rgba(255,255,255,.7); color: #3b2a20; }
  .recrow { display: grid; grid-template-columns: 1fr 90px 110px 34px; gap: 6px; margin: 6px 0; }
  @media (max-width: 460px) { .recrow { grid-template-columns: 1fr 80px; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<input type="file" id="planFile" accept=".json,application/json" hidden>
<dialog id="settings"><form method="dialog" id="settingsForm"></form></dialog>

<script>
/* ============================================================
   Fun Money — round 3
   Everything is saved inside the app on THIS device (localStorage).
   Nothing is sent anywhere. Use "Save a backup" to keep a copy.

   How the sums work: the app keeps your starting balances, your weekly
   plan and your list of entries, then recalculates every week from the
   start each time. So logging something late just slots it into the
   right week.
   ============================================================ */
const KEY = 'funMoney.v1'; // same storage spot as before, so old data is found

/* ---------- little helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round(n * 100) / 100;
function money(n) {
  const v = round2(n), a = Math.abs(v);
  const s = a.toLocaleString('en-NZ', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (v < 0 ? '−$' : '$') + s;
}
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const nice = s => parse(s).toLocaleDateString('en-NZ', { weekday: 'short', day: 'numeric', month: 'short' });
const monthName = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1).toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
const shiftMonth = (k, n) => { const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + n, 1); return iso(d).slice(0, 7); };
// "?today=2026-12-01" in the address bar lets us pretend it's another day (handy for testing).
function today() {
  const p = new URLSearchParams(location.search).get('today');
  return p && /^\d{4}-\d{2}-\d{2}$/.test(p) ? p : iso(new Date());
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- example starting numbers (everyone changes these in Settings) ---------- */
function defaultData(start) {
  const m0 = mondayOf(start);
  const weekly = { groceries: 120, stockup: 20, care: 50, pets: 20, fun: 40 };
  return {
    version: 3, confirmed: false, seq: 1,
    settings: {
      startDate: start,
      pots: [
        { id: 'groceries', name: 'Weekly shop', emoji: '🛒', type: 'build', shared: true, note: 'Log the full shop — only your share counts here.' },
        { id: 'stockup', name: 'Bulk stock-up', emoji: '📦', type: 'build', shared: true, note: 'Big orders that arrive in lumps. Dipping below $0 is fine.' },
        { id: 'care', name: 'Personal care', emoji: '💇', type: 'build', shared: false, note: '' },
        { id: 'pets', name: 'Pets', emoji: '🐾', type: 'build', shared: false, note: '' },
        { id: 'fun', name: 'Fun pot', emoji: '🎉', type: 'fun', shared: false, note: 'Clothes, gifts and treats.' },
      ],
      myShare: 50,                 // % of a shared purchase that's yours
      paybackOn: true, funFloor: 10,
      treatGoal: 1000, treatDate: addDays(start, 120),
      oneOffs: [{ name: 'Christmas', amount: 300 }],
    },
    // Weekly amounts and recurring costs, each with the Monday they start from (so changes never rewrite the past)
    plans: [{ from: m0, income: 450, weekly, recurring: [{ name: 'Insurance', amount: 15, every: 'week' }] }],
    // Balances on the plan start date
    opening: { savings: 2000, treat: 200, owed: 0, pots: { ...weekly } },
    entries: [],   // { id, seq, date, amount, pot, note, split? }  split = your share (0.5) of a shared purchase
    fixes: [],     // { seq, date, target, value }  "on this date the real figure was…"
    lastSeenMonday: m0, notice: null,
    lastBackup: null, checkins: {}, snooze: {},
  };
}

/* ---------- moving older data over ---------- */
function migrate(o) {
  if (!o || typeof o !== 'object') return null;
  if (o.version === 3) return o;
  if (o.version === 2) return upgradeTo3(o);
  if (o.version !== 1 || !o.settings || !o.week) return null;
  // Phase 1 data → round 2 shape, then up to round 3
  const s1 = o.settings, start = s1.startDate;
  const d = { version: 2, confirmed: !!o.confirmed, seq: 1, settings: { startDate: start }, entries: [], fixes: [], lastSeenMonday: mondayOf(start), notice: null };
  const typeMap = { carry: 'bills', weekly: 'build', fun: 'fun' };
  d.settings.pots = s1.pots.map(p => {
    const q = { id: p.id, name: p.name, emoji: p.emoji, type: typeMap[p.type] || 'build', note: p.note || '' };
    if (p.id === 'petscar' || /pets\s*&\s*car/i.test(p.name)) { q.name = 'Pets'; q.note = ''; }
    return q;
  });
  for (const k of ['paybackOn', 'funFloor', 'treatGoal', 'treatDate', 'oneOffs']) d.settings[k] = s1[k];
  d.plans = [{ from: mondayOf(start), income: +s1.income, weekly: Object.fromEntries(s1.pots.map(p => [p.id, +p.weekly])) }];
  const tx = o.tx || [];
  const sum = pot => tx.filter(t => t.pot === pot).reduce((a, t) => a + t.amount, 0);
  d.opening = {
    savings: round2(o.balances.savings + sum('oneoff:savings')), treat: round2(o.balances.treat + sum('oneoff:treat')), owed: o.balances.owed,
    pots: Object.fromEntries(s1.pots.map(p => [p.id, round2((o.week.pots[p.id] ?? 0) + sum(p.id))])),
  };
  d.entries = tx.map(t => ({ id: t.id, seq: d.seq++, date: t.date, amount: t.amount, pot: t.pot, note: t.note || '' }));
  return upgradeTo3(d);
}
// Round 3: the joint-account top-up is gone, pots can be shared, recurring costs live in the plan
function upgradeTo3(d) {
  const gone = d.settings.pots.filter(p => p.type === 'bills').map(p => p.id);
  d.settings.pots = d.settings.pots.filter(p => p.type !== 'bills').map(p => ({ shared: false, ...p }));
  d.settings.myShare = d.settings.myShare ?? 50;
  for (const pl of d.plans) { for (const id of gone) delete pl.weekly[id]; pl.recurring = pl.recurring || []; }
  for (const id of gone) delete d.opening.pots?.[id];
  d.entries = d.entries.filter(e => !gone.includes(e.pot) && e.dir !== 'in');
  d.fixes = d.fixes.filter(f => !gone.some(id => f.target === 'pot:' + id));
  d.lastBackup = d.lastBackup || null; d.checkins = d.checkins || {}; d.snooze = d.snooze || {};
  d.version = 3;
  return d;
}

/* ---------- load / save ---------- */
let D, C; // D = what's stored, C = what's calculated from it
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Hmm, I could not save in this browser. Try “Save a backup”.'); } }

/* ---------- the plan: weekly amounts, recurring costs, shared pots ---------- */
function planFor(d, monday) {
  const ps = d.plans.slice().sort((a, b) => a.from < b.from ? -1 : 1);
  let p = ps[0];
  for (const x of ps) if (x.from <= monday) p = x;
  return p;
}
const weeklyOf = (plan, id) => +(plan.weekly?.[id] || 0);
const totalWeekly = (d, plan) => d.settings.pots.reduce((t, p) => t + weeklyOf(plan, p.id), 0);
const perWeek = r => { const a = +r.amount || 0; return r.every === 'month' ? a * 12 / 52 : r.every === 'year' ? a / 52 : r.every === 'fortnight' ? a / 2 : a; };
const recurringWeekly = plan => round2((plan.recurring || []).reduce((t, r) => t + perWeek(r), 0));
const shareFrac = d => Math.min(1, Math.max(0.01, (+d.settings.myShare || 50) / 100));
// The other person's expected half of the shared pots each week (you pay it now, it's owed back)
const partnerWeekly = (d, plan) => round2(d.settings.pots.filter(p => p.shared).reduce((t, p) => t + weeklyOf(plan, p.id) * (1 - shareFrac(d)) / shareFrac(d), 0));
// The gentle savings drip: + means savings goes down each week
const expectedDrip = (d, plan) => round2(totalWeekly(d, plan) + recurringWeekly(plan) + partnerWeekly(d, plan) - plan.income);

/* ---------- the engine: replay every week from the start ---------- */
function compute(d, upto) {
  const s = d.settings, start = s.startDate, cur = mondayOf(upto);
  const known = new Set(s.pots.map(p => p.id));
  const fun = s.pots.find(p => p.type === 'fun');
  const bal = { savings: +d.opening.savings || 0, treat: +d.opening.treat || 0, owed: +d.opening.owed || 0 };
  const pots = {}; for (const p of s.pots) pots[p.id] = +(d.opening.pots?.[p.id] ?? 0);
  const months = {};
  const M = k => months[k] || (months[k] = { spent: {}, planned: {}, toTreat: 0, oneSav: 0, oneTreat: 0, moved: 0, repaid: 0, owedAdded: 0, recurring: 0, topups: 0, count: 0 });
  const used = {}; // how much of each planned one-off has been used
  const add = (o, k, v) => { o[k] = round2((o[k] || 0) + v); };
  for (const p of s.pots) add(M(start.slice(0, 7)).planned, p.id, pots[p.id]); // the starting amounts count as this month's plan
  let funBudget = fun ? pots[fun.id] : 0;

  const events = [
    ...d.entries.filter(e => e.date >= start && e.date <= upto).map(e => ({ ...e, kind: 'e' })),
    ...d.fixes.filter(f => f.date >= start && f.date <= upto).map(f => ({ ...f, kind: 'f' })),
  ].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));

  function apply(ev) {
    if (ev.kind === 'f') {
      if (ev.target.startsWith('pot:')) {
        const id = ev.target.slice(4);
        if (known.has(id)) { pots[id] = +ev.value; if (fun && id === fun.id) funBudget = Math.max(funBudget, +ev.value); }
      } else bal[ev.target] = +ev.value;
      return;
    }
    const m = M(ev.date.slice(0, 7)); m.count++;
    if (ev.pot === 'repay') { bal.savings += ev.amount; bal.owed -= ev.amount; m.repaid = round2(m.repaid + ev.amount); return; } // 🤝 paid back
    if (ev.pot.startsWith('move:')) { // planned move from savings into the Treat Fund
      bal.savings -= ev.amount; bal.treat += ev.amount; m.moved = round2(m.moved + ev.amount); add(used, ev.pot.slice(5), ev.amount); return;
    }
    if (ev.pot.startsWith('oneoff:') && ev.pot !== 'oneoff:savings' && ev.pot !== 'oneoff:treat') { // a named one-off, e.g. Christmas
      bal.savings -= ev.amount; m.oneSav = round2(m.oneSav + ev.amount); add(used, ev.pot.slice(7), ev.amount); return;
    }
    if (ev.pot === 'oneoff:savings') { bal.savings -= ev.amount; m.oneSav = round2(m.oneSav + ev.amount); }
    else if (ev.pot === 'oneoff:treat') { bal.treat -= ev.amount; m.oneTreat = round2(m.oneTreat + ev.amount); }
    else if (known.has(ev.pot)) {
      const mine = ev.split != null ? round2(ev.amount * ev.split) : ev.amount, theirs = round2(ev.amount - mine);
      pots[ev.pot] = round2(pots[ev.pot] - mine); add(m.spent, ev.pot, mine);
      if (theirs) { bal.savings -= theirs; bal.owed += theirs; m.owedAdded = round2(m.owedAdded + theirs); } // you paid their half; it's owed back
    }
  }

  const history = [];
  let monday = mondayOf(start), i = 0;
  for (let guard = 0; guard < 2000; guard++) {

    return `<div class="pot"><div class="pot-top"><span class="pot-name">${esc(o.emoji)} ${esc(o.name)}</span><span class="pot-amt">${money(u)} of ${money(amt)} used</span></div>
      <div class="bar violet"><span style="width:${pct(u, amt)}%"></span></div>
      <div class="note">${left > 0 ? `${money(left)} left. Log it with the ${esc(o.emoji)} ${esc(o.name)} button in Quick add.` : left === 0 ? 'All used — lovely planning 🌟' : `A little over (${money(-left)}) — savings has it covered 💛`}</div></div>`;
  }).join('') + `</div>`;
}
function normalizeOneOffs(list, prev = []) {
  return (list || []).map(o => {
    const old = prev.find(x => x.id && (x.id === o.id || x.name === o.name)) || {};
    const kind = o.kind || old.kind || (/treat fund/i.test(o.name || '') ? 'move' : 'spend');
    return { id: o.id || old.id || 'oo_' + uid(), name: o.name, amount: +o.amount || 0, kind,
      emoji: o.emoji || old.emoji || (kind === 'move' ? '🎁' : /christmas|xmas/i.test(o.name || '') ? '🎄' : '📌') };
  });
}

function banners() {
  const s = D.settings, n = D.notice, tdy = today();
  let h = '';
  if (n?.kind === 'catchup') {
    const pots = s.pots.filter(p => p.type === 'fun').concat(s.pots.filter(p => p.type === 'build'));
    h += `<div class="banner"><p><strong>Welcome back! 💛</strong></p>
      <p>Lovely to see you. It’s been ${n.weeks} weeks — fancy giving me one rough guess per pot? Roughly what did you spend while you were away? Skip any you’re not sure of.</p>
      <div class="catchup">${pots.map(p => `<label><span>${esc(p.emoji)} ${esc(p.name)}${p.shared ? ' <small>(full amount, I’ll split it)</small>' : ''}</span>
        <input type="number" inputmode="decimal" step="0.01" placeholder="$0" data-cu="${esc(p.id)}"></label>`).join('')}</div>
      <div class="actions"><button class="btn" id="cuSave">Save my guesses</button><button class="btn ghost" data-dismiss>Skip</button></div></div>`;
  } else if (n?.kind === 'newweek') {
    const last = C.history[C.history.length - 1];
    h += banner(`<p><strong>New week, full pots! 🌈</strong></p>${last ? lastWeekLines(last) : ''}`, 'Let’s go');
  } else if (n?.kind === 'moved') h += banner(`<p><strong>New version, same you 🌱</strong></p><p>I kept your settings and balances.</p>`, 'Great');

  if (!D.confirmed) h += `<div class="banner"><p><strong>${D.planLoaded ? 'Your new plan is in ✨' : 'Quick check 👀'}</strong> ${D.planLoaded
      ? 'Have a look at your pots and in ⚙️ Settings. Change anything that’s not right, then tap “They’re right”.'
      : 'These are example numbers. Pop your own in (or load a backup or your plan file) and you’re away.'}</p>
      <div class="actions"><button class="btn" id="checkNums">Check my numbers</button><button class="btn ghost" id="confirmNums">They’re right</button></div></div>`;
  if (tdy < s.startDate) h += `<div class="banner"><p>Your plan starts on <strong>${nice(s.startDate)}</strong>. Until then, have a play!</p></div>`;

  // Monthly savings check-in (not in the plan's first month)
  const mk = tdy.slice(0, 7);
  if (mk > s.startDate.slice(0, 7) && !D.checkins[mk] && !(D.snooze.checkin >= tdy)) {
    h += `<div class="banner"><p><strong>💰 Monthly savings check-in</strong></p>
      <p>What does your savings account say today? My guess is about ${money(C.bal.savings)}.</p>
      <div class="inbox"><input id="ciAmt" type="number" inputmode="decimal" step="0.01" placeholder="$0" aria-label="Real savings balance"></div>
      <div class="actions"><button class="btn" id="ciSave">Check it</button><button class="btn ghost" id="ciLater">Not now</button></div></div>`;
  }
  // Calm heads-up, 3 months before the safety floor
  const pr = projection();
  if (pr.state === 'drifting' && pr.weeks <= 13 && !(D.snooze.floor >= tdy)) {
    const help = Math.max(50, Math.ceil(pr.drip * 8 / 50) * 50), later = addDays(pr.date, Math.round(help / pr.drip * 7));
    h += `<div class="banner"><p><strong>💛 Gentle heads-up</strong> At this pace you’d reach your ${money(pr.floor)} floor around ${niceLong(pr.date)} (${lengthText(pr.weeks)}).</p>
      <p>A ${money(help)} repayment would push that out to about ${niceLong(later)}. Every little bit helps 🌱</p>
      <div class="actions"><button class="btn ghost" id="floorLater">Got it</button></div></div>`;
  }
  // Treat Fund top-up reminder, from a week before the big day
  for (const o of s.oneOffs.filter(o => o.kind === 'move')) {
    const gap = treatGap(o), daysLeft = daysBetween(tdy, s.treatDate);
    if (gap > 0 && daysLeft >= 0 && daysLeft <= 7) h += `<div class="banner"><p><strong>🎁 The big day is in ${daysLeft} ${daysLeft === 1 ? 'day' : 'days'}!</strong> Time to top up your Treat Fund to ${money(s.treatGoal)}.</p>
      <div class="actions"><button class="btn" data-move="${esc(o.id)}">Top it up (moves ${money(gap)})</button></div></div>`;
  }
  // Gentle monthly backup reminder
  const since = D.lastBackup || s.startDate;
  if (daysBetween(since, tdy) >= 30 && !(D.snooze.backup >= tdy)) {
    h += `<div class="banner"><p><strong>💾 Little reminder</strong> It’s been a while since your last backup. It takes five seconds and keeps your numbers safe.</p>
      <div class="actions"><button class="btn" id="bkNow">Save a backup</button><button class="btn ghost" id="bkLater">Later</button></div></div>`;
  }
  return h;
}
function banner(inner, btn) { return `<div class="banner">${inner}<div class="actions"><button class="btn" data-dismiss>${btn}</button></div></div>`; }

function lastWeekLines(w) {
  const spent = round2(w.funBudget - w.funLeft);
  return `<p>${w.funLeft < 0 ? `🎉 Last week was a generous one — savings happily covered the extra ${money(-w.funLeft)}.` : `🎉 Last week you used ${money(Math.max(0, spent))} of your ${money(w.funBudget)} fun pot.`}</p>

}

function monthCard() {
  const s = D.settings, startM = s.startDate.slice(0, 7), nowM = today().slice(0, 7);
  if (!viewMonth) viewMonth = nowM;
  const m = C.months[viewMonth] || { spent: {}, planned: {}, toTreat: 0, oneSav: 0, oneTreat: 0, owedAdded: 0, recurring: 0, topups: 0, count: 0 };
  const canBack = viewMonth > startM, canFwd = viewMonth < nowM;
  let h = `<section class="card"><div class="month-head"><h2>${viewMonth === nowM ? 'This month' : 'Month'} · ${monthName(viewMonth)}</h2>
    <span><button class="navbtn" data-month="-1" ${canBack ? '' : 'disabled'} aria-label="Previous month">‹</button>
    <button class="navbtn" data-month="1" ${canFwd ? '' : 'disabled'} aria-label="Next month">›</button></span></div>`;
  for (const p of s.pots) {

      <div class="bar violet"><span style="width:${pct(spent, plan)}%"></span></div>
      ${spent > plan && p.type === 'build' ? `<div class="note">Used some saved-up money — that’s what it’s for 🌼</div>` : ''}</div>`;
  }
  const extras = [];
  if (m.toTreat > 0) extras.push(`🎁 ${money(m.toTreat)} went to your Treat Fund this month!`);
  if (m.owedAdded) extras.push(`🤝 ${money(m.owedAdded)} added to “owed to me” this month.`);
  if (m.repaid) extras.push(`🤝 ${money(m.repaid)} paid back this month 🎉`);
  if (m.moved) extras.push(`➡️ ${money(m.moved)} moved from savings into your Treat Fund 🎉`);
  if (m.oneSav || m.oneTreat) extras.push(`✈️ One-offs: ${[m.oneSav ? money(m.oneSav) + ' from savings' : '', m.oneTreat ? money(m.oneTreat) + ' from the Treat Fund' : ''].filter(Boolean).join(' · ')}`);
  if (m.recurring) extras.push(`🔁 ${money(m.recurring)} of recurring costs, counted automatically.`);
  extras.push(m.count >= 5 ? `✨ You logged ${m.count} things this month — lovely tracking.` : m.topups ? `🌼 Your pots topped up ${m.topups} ${m.topups === 1 ? 'time' : 'times'} this month.` : '🌱 A fresh month, ready to go.');
  h += extras.map(x => `<p class="month-line">${x}</p>`).join('') + `<div class="note">Your share spent, next to the planned top-ups for the calendar month.</div></section>`;
  return h;
}

  $('#ciSave') && ($('#ciSave').onclick = () => {
    const real = parseFloat($('#ciAmt').value); if (!isFinite(real)) { $('#ciAmt').focus(); return; }

    D.checkins[today().slice(0, 7)] = { date: today(), guess, real: round2(real) };
    addFix('savings', real); save(); recalc(); render();
    if (diff >= 0) { toast(diff > 0 ? `You’re ${money(diff)} ahead of my guess! 🎉` : 'Spot on with my guess! 🎯'); confetti(); }
    else toast(`A little under my guess (${money(-diff)}) — no stress, I’ve updated it 🌱`);

  // Backup reminder
  $('#bkNow') && ($('#bkNow').onclick = backup);
  $('#bkLater') && ($('#bkLater').onclick = () => { D.snooze.backup = addDays(today(), 6); save(); render(); });

  $('#backupBtn').onclick = backup;
  $('#restoreBtn').onclick = () => $('#restoreFile').click();
}
// The weeks you were away (for spreading rough guesses evenly)
function missedWeeks() {
  const cur = mondayOf(today()), first = [D.notice?.from || addDays(cur, -7), mondayOf(D.settings.startDate)].sort()[1];
  const out = []; for (let m = first; m < cur; m = addDays(m, 7)) out.push(m);
  return out.length ? out : [cur];
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3600);
}
function confetti() {
  const bits = ['🎉', '✨', '💛', '🌟', '🌼'];
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('div'); c.className = 'confetti'; c.textContent = pick(bits);
    c.style.left = Math.random() * 100 + 'vw'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2200);
  }
}

/* ---------- backup ---------- */
function backedUp() { D.lastBackup = today(); D.snooze.backup = null; save(); render(); }
async function backup() {
  const name = `fun-money-backup-${today()}.json`;
  const text = JSON.stringify(D, null, 2);
  try { // iPhone: open the Share sheet so you can tap "Save to Files"
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
      await navigator.share({ files: [file], title: 'Fun Money backup' });
      backedUp(); toast('Backup ready 💾 Choose “Save to Files”.');
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  backedUp(); toast('Backup saved 💾 Nice one!');
}
$('#restoreFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    if (raw && raw.funMoneyPlan) { previewPlan(raw); e.target.value = ''; return; } // picked the plan file by mistake — that's fine too
    const data = migrate(raw);
    if (!data) throw 0;
    if (!confirm('Load this backup? It replaces what’s on screen now.')) return;
    D = data; start();
    toast('Backup loaded 📂');
  } catch (err) { toast('That file doesn’t look like a Fun Money backup.'); }
  e.target.value = '';
};

$('#planFile').onchange = async e => {

  catch (err) { toast('That doesn’t look like a Fun Money plan file.'); }
  e.target.value = '';
};
function previewPlan(P) {
  const rec = (P.recurring || []).map(r => `${esc(r.name)} ${money(r.amount)} a ${esc(r.every || 'week')}`).join(', ') || 'none';
  const total = P.pots.reduce((t, p) => t + (+p.weekly || 0), 0);
  $('#settingsForm').innerHTML = `<div class="sheet"><h2>📋 Your new plan</h2>
    <p class="note">Have a look. Nothing changes until you tap “Use this plan”. Your entries stay put. (Saving a backup first is a nice idea.)</p>
    <h3>Money in</h3><p>Income ${money(P.income)} a week</p>
    <h3>Pots (your share, per week)</h3>
    ${P.pots.map(p => `<p>${esc(p.emoji)} <strong>${esc(p.name)}</strong> ${money(p.weekly)}${p.shared ? ` · 👫 shared (your share ${P.myShare ?? 50}%)` : ''}${p.type === 'fun' ? ' · resets weekly' : ' · carries over'}</p>`).join('')}
    <p class="note">Total ${money(total)} a week.</p>
    <h3>Recurring</h3><p>${rec}</p>
    ${P.balances ? `<h3>Balances</h3><p>${D.planApplied ? 'Keeping your current balances (a plan file only sets them the first time).' : `💰 Savings ${money(P.balances.savings)} · 🎁 Treat Fund ${money(P.balances.treat)} · 🤝 Owed to me ${money(P.balances.owed)}`}</p>` : ''}
    <h3>Treat Fund</h3><p>Goal ${money(P.treatGoal)} by ${P.treatDate ? nice(P.treatDate) + ' ' + P.treatDate.slice(0, 4) : '—'}</p>
    <h3>Planned one-offs</h3><p>${(P.oneOffs || []).map(o => `${esc(o.name)} ${money(o.amount)}`).join(' · ') || 'none'}</p>
    <p class="note">The new pots start this week. You can change any figure in Settings afterwards.</p></div>
    <div class="sheet-actions"><button type="button" class="btn ghost" id="planCancel">Cancel</button><button type="button" class="btn" id="planUse">Use this plan</button></div>`;
  const dlg = $('#settings'); if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0;
  $('#planCancel').onclick = () => dlg.close();
  $('#planUse').onclick = () => { applyPlan(P); dlg.close(); recalc(); render(); toast('New plan in place ✨ Have a look!'); confetti(); };
}
function applyPlan(P) {
  const s = D.settings, wk = C.weekStart, firstWeek = wk === mondayOf(s.startDate);
  const weekly = Object.fromEntries(P.pots.map(p => [p.id, +p.weekly || 0]));
  const opening = D.opening.pots || (D.opening.pots = {});
  for (const p of P.pots) {
    const isNew = !s.pots.some(x => x.id === p.id);
    if (firstWeek) opening[p.id] = (isNew || p.type === 'fun' || opening[p.id] === weeklyOf(planFor(D, wk), p.id)) ? +p.weekly || 0 : opening[p.id];
    else if (isNew) opening[p.id] = 0;
  }
  s.pots = P.pots.map(p => ({ id: p.id, name: p.name, emoji: p.emoji || '🪴', type: p.type === 'fun' ? 'fun' : 'build', shared: !!p.shared, note: p.note || '' }));
  D.plans = D.plans.filter(p => p.from < wk).concat({ from: wk, income: +P.income, weekly, recurring: (P.recurring || []).map(r => ({ name: r.name, amount: +r.amount, every: r.every || 'week' })) });
  const prevOneOffs = s.oneOffs;
  for (const k of ['myShare', 'paybackOn', 'funFloor', 'treatGoal', 'treatDate', 'oneOffs', 'savingsFloor', 'savingsGoal']) if (P[k] !== undefined) s[k] = P[k];
  s.oneOffs = normalizeOneOffs(s.oneOffs, prevOneOffs);
  recalc();
  if (P.balances && !D.planApplied) for (const k of ['savings', 'treat', 'owed']) if (isFinite(+P.balances[k]) && Math.abs(+P.balances[k] - C.bal[k]) > 0.004) addFix(k, +P.balances[k]);
  D.confirmed = false; D.planLoaded = true; D.planApplied = true;
  save();
}

/* ---------- settings ---------- */
function openSettings() {
  const s = D.settings, b = C.bal, next = addDays(C.weekStart, 7), np = planFor(D, next);
  const num = (id, val) => `<input type="number" step="0.01" id="${id}" value="${esc(val)}">`;
  let h = `<div class="sheet"><h2>⚙️ Your numbers</h2>
    <p class="note">Change anything here — no code needed. “Every week” amounts and recurring costs start from next Monday (${nice(next)}). To change things right now, edit “Available now”.</p>
    <p><button type="button" class="btn ghost" id="loadPlan">📋 Load my plan file</button></p>
    <h3>Money in</h3>
    <div class="field"><label>Weekly income<small>What you pay yourself each week</small></label>${num('s_income', np.income)}</div>
    <h3>Pots</h3>`;
  s.pots.forEach((p, i) => {
    h += `<div class="potedit">
      <div style="display:grid;grid-template-columns:60px 1fr;gap:8px"><input id="p_emoji_${i}" value="${esc(p.emoji)}" aria-label="Emoji"><input id="p_name_${i}" value="${esc(p.name)}" aria-label="Pot name"></div>
      <div class="row">
        <div><label>Every week${p.shared ? ' (your share)' : ''}</label>${num('p_weekly_' + i, weeklyOf(np, p.id))}</div>
        <div><label>Available now</label>${num('p_left_' + i, C.pots[p.id] ?? 0)}</div>
      </div>
      ${p.type === 'build' ? `<label class="check"><input type="checkbox" id="p_shared_${i}" ${p.shared ? 'checked' : ''}> 👫 Shared — I log the full amount, only my share counts</label>` : ''}
      <div class="row" style="grid-template-columns:1fr auto"><input id="p_note_${i}" value="${esc(p.note || '')}" placeholder="Note (optional)" aria-label="Note">
        ${p.type === 'build' ? `<button type="button" class="linkish" data-rmpot="${i}">remove</button>` : ''}</div>
    </div>`;
  });
  const drip = expectedDrip(D, np);
  h += `<button type="button" class="linkish" id="addPot">+ add a pot</button>
    <div class="field"><label>My share of shared pots<small>As a %, e.g. 50</small></label>${num('s_share', s.myShare)}</div>
    <h3>Recurring costs</h3>
    <p class="note">Things that count themselves, like insurance. They come out of savings automatically.</p>
    <div id="recurring">${(np.recurring || []).map(recRow).join('')}</div>
    <button type="button" class="linkish" id="addRec">+ add one</button>
    <p class="note">Pots ${money(totalWeekly(D, np))} + recurring ${money(recurringWeekly(np))} + the shared half you front ${money(partnerWeekly(D, np))}, against income ${money(np.income)}:
      ${drip > 0 ? `a gentle savings drip of about ${money(drip)} a week.` : `savings grows about ${money(-drip)} a week.`}</p>
    <h3>Savings safety net</h3>
    <div class="field"><label>Safety floor<small>Savings you never want to go below</small></label>${num('s_floor_sav', s.savingsFloor ?? '')}</div>
    <div class="field"><label>Savings goal 🏁<small>Where you’d love to get to</small></label>${num('s_goal_sav', s.savingsGoal ?? '')}</div>
    <h3>Overspending the fun pot</h3>
    <label class="check"><input type="checkbox" id="s_payback" ${s.paybackOn ? 'checked' : ''}> Makes next week’s fun pot smaller</label>
    <div class="field"><label>…but never below<small>So there’s always something</small></label>${num('s_floor', s.funFloor)}</div>
    <p class="note">Your other pots can dip below $0 with no fuss — they just catch up.</p>
    <h3>Balances right now</h3>
    <div class="field"><label>💰 Savings</label>${num('s_savings', b.savings)}</div>
    <div class="field"><label>🎁 Treat Fund</label>${num('s_treat', b.treat)}</div>
    <div class="field"><label>Treat Fund goal</label>${num('s_goal', s.treatGoal)}</div>
    <div class="field"><label>Treat Fund date<small>The big day you’re saving for</small></label><input type="date" id="s_tdate" value="${esc(s.treatDate)}"></div>
    <div class="field"><label>🤝 Owed to me<small>Never counted as spendable</small></label>${num('s_owed', b.owed)}</div>
    <h3>Planned one-offs from savings</h3><p class="note">Each one gets its own little budget with a countdown. Christmas-type ones get a Quick add button; a Treat Fund top-up gets a one-tap “Move” button.</p><div id="oneoffs">${s.oneOffs.map(oneOffRow).join('')}</div>
    <button type="button" class="linkish" id="addOneOff">+ add one</button>
    <h3>Plan start</h3>
    <div class="field"><label>Plan starts on<small>Changing this restarts the plan from today’s balances and clears entries</small></label><input type="date" id="s_start" value="${esc(s.startDate)}"></div>
    <p><button type="button" class="linkish" id="resetAll">Start completely fresh (wipes everything)</button></p></div>
    <div class="sheet-actions"><button type="button" class="btn ghost" id="cancelS">Cancel</button><button type="button" class="btn" id="saveS">Save</button></div>`;
  $('#settingsForm').innerHTML = h;
  const dlg = $('#settings'); if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0;

  $('#cancelS').onclick = () => dlg.close();
  $('#loadPlan').onclick = () => $('#planFile').click();
  $('#addOneOff').onclick = () => { $('#oneoffs').insertAdjacentHTML('beforeend', oneOffRow({ name: '', amount: '' })); wireRows(); };
  $('#addRec').onclick = () => { $('#recurring').insertAdjacentHTML('beforeend', recRow({ name: '', amount: '', every: 'week' })); wireRows(); };
  wireRows();
  $('#addPot').onclick = () => {
    collectSettings();
    const id = 'pot_' + uid();
    D.settings.pots.splice(D.settings.pots.findIndex(p => p.type === 'fun'), 0, { id, name: 'New pot', emoji: '🪴', type: 'build', shared: false, note: '' });
    save(); recalc(); openSettings();
  };
  document.querySelectorAll('[data-rmpot]').forEach(btn => btn.onclick = () => {
    const p = D.settings.pots[+btn.dataset.rmpot];
    if (!confirm(`Remove the “${p.name}” pot? Its entries will stop counting.`)) return;
    collectSettings();
    D.settings.pots = D.settings.pots.filter(x => x.id !== p.id); save(); recalc(); openSettings();
  });
  $('#resetAll').onclick = () => {
    if (!confirm('Wipe everything and start again with the example numbers? (Maybe save a backup first!)')) return;
    D = defaultData(today()); dlg.close(); start(); toast('Fresh start 🌱');
  };
  $('#saveS').onclick = () => {
    const newStart = $('#s_start').value;
    if (newStart && newStart !== D.settings.startDate) {
      if (!confirm(`Restart the plan from ${nice(newStart)}? Today’s balances become the starting balances and your entries are cleared.`)) return;
      collectSettings(); recalc();
      const np = planFor(D, addDays(C.weekStart, 7));
      D.settings.startDate = newStart;
      D.plans = [{ ...np, from: mondayOf(newStart) }];
      D.opening = { savings: C.bal.savings, treat: C.bal.treat, owed: C.bal.owed, pots: { ...C.pots } };
      D.entries = []; D.fixes = []; D.lastSeenMonday = mondayOf(today() < newStart ? newStart : today());
    } else collectSettings();
    D.confirmed = true; D.planLoaded = false; save(); dlg.close(); recalc(); render(); toast('Saved! 🙌');
  };
}
function oneOffRow(o) {
  const k = o.kind || 'spend';
  return `<div class="oneoff" data-oo-id="${esc(o.id || '')}"><input data-oo-emoji value="${esc(o.emoji || '')}" aria-label="Emoji" placeholder="🎄"><input data-oo-name value="${esc(o.name)}" placeholder="What for">
    <input data-oo-amt type="number" step="0.01" value="${esc(o.amount)}" placeholder="$"><button type="button" class="linkish" data-rm-row aria-label="Remove">✕</button>
    <select data-oo-kind aria-label="What kind"><option value="spend"${k === 'spend' ? ' selected' : ''}>Spend from savings (gets a Quick add button)</option><option value="move"${k === 'move' ? ' selected' : ''}>Top up the Treat Fund to its goal (just in time)</option></select></div>`;
}
function recRow(r) {
  const opt = v => `<option value="${v}"${(r.every || 'week') === v ? ' selected' : ''}>a ${v}</option>`;
  return `<div class="recrow"><input data-rc-name value="${esc(r.name)}" placeholder="What (e.g. insurance)"><input data-rc-amt type="number" step="0.01" value="${esc(r.amount)}" placeholder="$">
    <select data-rc-every aria-label="How often">${['week', 'fortnight', 'month', 'year'].map(opt).join('')}</select><button type="button" class="linkish" data-rm-row aria-label="Remove">✕</button></div>`;
}
function wireRows() { document.querySelectorAll('[data-rm-row]').forEach(b => b.onclick = () => b.parentElement.remove()); }

// Read the settings form. Weekly amounts → a plan from next Monday. Balances → a dated correction.
function collectSettings() {
  const s = D.settings;
  const n = (id, fb) => { const v = parseFloat($('#' + id)?.value); return isFinite(v) ? round2(v) : fb; };
  const next = addDays(C.weekStart, 7), old = planFor(D, next);
  const plan = { from: next, income: n('s_income', old.income), weekly: { ...old.weekly }, recurring: old.recurring || [] };
  const fix = (target, val, was) => { if (Math.abs(val - was) > 0.004) addFix(target, val); };
  s.pots.forEach((p, i) => {
    if (!$('#p_name_' + i)) return;
    p.name = $('#p_name_' + i).value.trim() || p.name;
    p.emoji = $('#p_emoji_' + i).value.trim() || p.emoji;
    p.note = $('#p_note_' + i).value.trim();
    if ($('#p_shared_' + i)) p.shared = $('#p_shared_' + i).checked;
    plan.weekly[p.id] = n('p_weekly_' + i, weeklyOf(old, p.id));
    fix('pot:' + p.id, n('p_left_' + i, C.pots[p.id] ?? 0), C.pots[p.id] ?? 0);
  });
  if ($('#recurring')) plan.recurring = [...document.querySelectorAll('.recrow')].map(r => ({ name: r.querySelector('[data-rc-name]').value.trim(),
    amount: parseFloat(r.querySelector('[data-rc-amt]').value) || 0, every: r.querySelector('[data-rc-every]').value })).filter(r => r.name || r.amount);
  if (JSON.stringify([plan.income, plan.weekly, plan.recurring]) !== JSON.stringify([old.income, old.weekly, old.recurring || []])) {
    D.plans = D.plans.filter(p => p.from < next).concat(plan);
  }
  s.myShare = Math.min(100, Math.max(1, n('s_share', s.myShare)));
  const fl = parseFloat($('#s_floor_sav').value), gl = parseFloat($('#s_goal_sav').value);
  s.savingsFloor = isFinite(fl) ? round2(fl) : null; s.savingsGoal = isFinite(gl) ? round2(gl) : null;
  s.paybackOn = $('#s_payback').checked;
  s.funFloor = n('s_floor', s.funFloor);
  fix('savings', n('s_savings', C.bal.savings), C.bal.savings);
  fix('treat', n('s_treat', C.bal.treat), C.bal.treat);
  fix('owed', n('s_owed', C.bal.owed), C.bal.owed);
  s.treatGoal = n('s_goal', s.treatGoal); s.treatDate = $('#s_tdate').value || s.treatDate;
  s.oneOffs = normalizeOneOffs([...document.querySelectorAll('.oneoff')].map(r => ({ id: r.dataset.ooId || undefined, emoji: r.querySelector('[data-oo-emoji]').value.trim(),
    name: r.querySelector('[data-oo-name]').value.trim(), amount: parseFloat(r.querySelector('[data-oo-amt]').value) || 0, kind: r.querySelector('[data-oo-kind]').value }))
    .filter(o => o.name || o.amount), s.oneOffs);
  save();
}

/* ---------- start! ---------- */
function start() {
  D = migrate(D) || defaultData(today());
  D.settings.oneOffs = normalizeOneOffs(D.settings.oneOffs, D.settings.oneOffs);
  const cur = mondayOf(today());
  if (D.lastSeenMonday && cur > D.lastSeenMonday && cur > mondayOf(D.settings.startDate)) {
    const weeks = Math.round(daysBetween(D.lastSeenMonday, cur) / 7);
    D.notice = weeks >= 2 ? { kind: 'catchup', weeks, from: D.lastSeenMonday } : { kind: 'newweek' };
  }
  if (!D.lastSeenMonday || cur > D.lastSeenMonday) D.lastSeenMonday = cur;
  save(); recalc(); render();
}
D = load() || defaultData(today());
start();
// Works without signal once it's on a proper web address (not when opened as a file)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
